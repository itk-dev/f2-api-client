name: Mago

env:
    COMPOSE_USER: runner

on:
    pull_request:
    push:
        branches:
            - main
            - develop

jobs:
    # https://mago.carthage.software/latest/en/guide/getting-started/
    mago:
        name: Mago
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - run: |
                  docker compose run --rm phpfpm composer install

            - name: lint
              run: |
                  docker compose run --rm mago lint

            - name: format
              if: false # Mago and PHP CS Fixer does not (yet) agree on how to format code.
              run: |
                  docker compose run --rm mago format --check

            - name: analyze
              run: |
                  docker compose run --rm mago analyze
